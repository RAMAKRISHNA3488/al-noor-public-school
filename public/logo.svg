<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2238"/>
      <stop offset="100%" stop-color="#0E1322"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA52E"/>
      <stop offset="100%" stop-color="#FF7B00"/>
    </linearGradient>
  </defs>
  <!-- Outer Gold Ring -->
  <circle cx="50" cy="50" r="47" fill="url(#shieldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="#FFA52E" stroke-width="1.2" stroke-dasharray="3,2"/>
  
  <!-- Central Emblem: Sun rays & Open Book -->
  <!-- Rays of Noor (Light) -->
  <path d="M50 18 L50 25 M40 21 L43 27 M60 21 L57 27 M33 27 L38 31 M67 27 L62 31" stroke="#FFA52E" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Torch / Flame of Knowledge -->
  <path d="M50 26 C47 31, 46 34, 48 37 C49 39, 51 39, 52 37 C54 34, 53 31, 50 26 Z" fill="url(#goldGrad)"/>
  
  <!-- Open Book of Learning -->
  <path d="M50 52 C45 47, 30 46, 23 49 L23 68 C31 65, 45 66, 50 71 C55 66, 69 65, 77 68 L77 49 C70 46, 55 47, 50 52 Z" fill="#FFFFFF" stroke="#FFA52E" stroke-width="1.8"/>
  <path d="M50 52 L50 71" stroke="#1B2238" stroke-width="2"/>
  <!-- Book page lines -->
  <line x1="28" y1="56" x2="44" y2="54" stroke="#1976ED" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="28" y1="61" x2="44" y2="59" stroke="#1976ED" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="54" x2="72" y2="56" stroke="#1976ED" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="56" y1="59" x2="72" y2="61" stroke="#1976ED" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Ribbon banner at bottom -->
  <path d="M25 78 Q50 85 75 78 L73 84 Q50 91 27 84 Z" fill="url(#goldGrad)"/>
  <text x="50" y="83" font-family="'Roboto', sans-serif" font-size="5" font-weight="bold" fill="#1B2238" text-anchor="middle" letter-spacing="1">EST. 2005</text>
</svg>
